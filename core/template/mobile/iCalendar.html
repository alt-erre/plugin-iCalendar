<script language="javascript">
if (typeof _iCal_selectedDay === 'undefined') var _iCal_selectedDay = [];
// Met à jour le Widget //
function iCal_refreshWidget(_eqLogId, _iCalsCmd,_today) {
	var _viewHtml=''; 
	iCal_generateDate(_eqLogId,_today);
	if (count(_iCalsCmd) > 0) {
		$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .iCalendar_div').empty();
		for (var _idCmd in _iCalsCmd) {
			if (init(_iCal_selectedDay[_idCmd])=='') { _iCal_selectedDay[_idCmd]='J0'; }
			iCal_generateFullCalendar(_eqLogId, _iCalsCmd[_idCmd]);
			iCal_showCalendar(_eqLogId, _iCalsCmd[_idCmd].param.id, _iCal_selectedDay[_idCmd]);
		}
	}
}
// Formate les données pour les afficher dans le calendrier (1 agenda, avec 1 ou plusieurs jours) //
function iCal_generateFullCalendar(_eqLogId, _iCal) {
	var _vHtml="<div class='tooltips iCalendar_cal cmd' data-cmd_id='"+ _iCal.param.id +"'>";
	if (_iCal.param.periodeView>0) { _vHtml +="<div class='iCalendar_calSelectDay' style='display:none;'></div>"; }
	_vHtml +="<div class='iCalendar_calFull'></div></div>";
	$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .iCalendar_div').append(_vHtml);
	// génération du contenu de l'agenda //
	for (var _oneCal in _iCal) {
		if (_oneCal!='param') { iCal_generateOneCalendar(_eqLogId, _iCal[_oneCal], _iCal.param); }
	}
}
// Formate les données pour 1 journée de l'agenda //
function iCal_generateOneCalendar(_eqLogId, _iCal, _param) {
	_vHtml ="<div class='iCalendar_calOneDay' data-day_id='"+ _iCal.dayView +"' style='display:none;'>";
	_vHtml +="<div class='iCalendar_items'>";
	for (i=0; i<_iCal.items.length; i++) {
		_itemId = _iCal.id +"-"+ i;
		_sEventHours = ((_iCal.items[i].hd!='')&&(_iCal.items[i].hf!=''))?"<span class='iCalendar_hour'>(" + _iCal.items[i].hd +"-"+ _iCal.items[i].hf +")</span>":"";
		_sEventClass = "iCalendar_itemActif";
		switch(_iCal.items[i].s) {
			case "DA": _sEventState = "<i class='fa fa-plus-circle' style='color:#FF0000;'></i>"; break;
			case "FA": _sEventState = "<i class='fa fa-ban' style='color:#FF0000;'></i>"; break;
			case "A": _sEventState = "<i class='fa fa-check-circle' style='color:#0000FF;'></i>"; break;
			case "P": _sEventState = ""; _sEventClass = "iCalendar_itemInactif"; break;
			default: _sEventState = "";
		}
		_sEventClass = (i<(_iCal.items.length -1))?_sEventClass+" iCalendar_itemBorder":_sEventClass;
		_sEventIsAction = "";
		if ((_param.launchInteract=='1')&&(isset(_iCal.items[i].actSc))&&(_iCal.items[i].actSc=='inter')) {
			_sEventIsAction = "<i class='fa fa-comment' data-item_id='"+ _itemId +"'></i> ";
		} else if ((_param.launchActSc=='1')&&(isset(_iCal.items[i].actSc))) {
			_sEventIsAction = "<i class='fa fa-cogs' data-item_id='"+ _itemId +"'></i> ";
		}
		_sEventTxt = _sEventIsAction + _iCal.items[i].t;
		_sEventLocation = ((_param.showLocation==1)&&(_iCal.items[i].loc!=''))?' ('+_iCal.items[i].loc+')':'';
		_vHtml +="<div class='"+ _sEventClass +"'>" + _sEventHours + " "+ _sEventState +" "+ _sEventTxt + _sEventLocation + "</div>";
	}
	_vHtml +="</div></div>";
	$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .cmd[data-cmd_id='+ _param.id +'] .iCalendar_calFull').append(_vHtml);
	// zone menu des dates //
	if (_param.periodeView>0) {
		_vHtml ="<span class='iCalendar_day ui-btn ui-mini ui-btn-inline' data-cmd_uid='"+ _iCal.cmdUid +"' data-day_id='"+ _iCal.dayView +"' style='margin-top:0px!important;'>"+ _iCal.dayHumanD +"</span>";
		$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .cmd[data-cmd_id='+ _param.id +'] .iCalendar_calSelectDay').append(_vHtml).show();
		$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .cmd[data-cmd_id='+ _param.id +'] .iCalendar_day').on('click', function () {
			iCal_showCalendar(_eqLogId, _iCal.originId, $(this).attr('data-day_id'));
		});
	}
}
// Affiche le jour sélectionné //
function iCal_showCalendar(_eqLogId, _cmdId, _idDay) {
	$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .cmd[data-cmd_id='+ _cmdId +'] .iCalendar_calOneDay').hide();
	$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .cmd[data-cmd_id='+ _cmdId +'] .iCalendar_day').removeClass('iCalSelected');
	$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .cmd[data-cmd_id='+ _cmdId +'] .iCalendar_calOneDay[data-day_id='+ _idDay+']').show();
	$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .cmd[data-cmd_id='+ _cmdId +'] .iCalendar_day[data-day_id='+ _idDay+']').addClass('iCalSelected');
	_iCal_selectedDay[_cmdId]=_idDay;
	iCal_resizeHeight(_eqLogId);
}
// Définie les couleurs de fond principaux //
function iCal_setCSSOption(_eqLogId, _bgColor, _bgTitleColor, _bgItemColor) {
	if ((_bgColor!='')&&(_bgColor.replace('#','')!='bgColor')) {
		$('.eqLogic[data-eqLogic_id='+ _eqLogId +'].iCalendar_mobile').css('background-color', _bgColor +'!important');
	}
	if (( _bgItemColor!='')&&(_bgItemColor.replace('#','')!='bgItemColor')) {
		$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .iCalendar_div .tooltips').css('background-color', _bgItemColor);
	}
	if (( _bgTitleColor!='')&&(_bgTitleColor.replace('#','')!='bgTitleColor')) {
		$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .iCalendar_day').css('background-color', _bgTitleColor);
	}
}
// Genere l'affichage de la Date //
function iCal_generateDate(_eqLogId,_today) {
	if (_today!='') {
		var _vHtml="<center><i class='icon divers-calendar2' style='font-size:3.5em;'></i></center>";
		_vHtml += "<div style='position:absolute;top:0.7em;font-weight:bold;font-size:1.6em;width:100%;'><center><span style='padding:0px 10px 0px 9px;border:1px solid #FFFFFF;background-color:#background-color#;#style#'>"+ _today +"</span></center></div>";
		$('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .iCalendar_date').html(_vHtml);
	}
}
// Définie la hauteur de la tuile //
function iCal_resizeHeight(_eqLogId) {
	eval('_allowResize = (_iCalendar'+ _eqLogId +'_allowAutoResize==1)?_iCalendar'+ _eqLogId +'_allowAutoResize:false;');
	if (_allowResize) {
		setTimeout(function(){
			_multiple = 80;
			_height = 1 + parseInt($('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .iCalendar_title').height())
				+ parseInt($('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .iCalendar_date').height())
				+ parseInt($('.eqLogic[data-eqLogic_id='+ _eqLogId +'] .iCalendar_div').height());
			_heightNew = Math.ceil(_height/_multiple)*_multiple;
			$('.eqLogic[data-eqLogic_id='+ _eqLogId +']').css('height',_heightNew+'px');
			$('.objectHtml').packery();
		},200);
	}
}
</script>

<style>
.iCalendar_mobile { }
.iCalendar_div {	padding-top:5px; }
.iCalendar_div .tooltips {	padding:1px; margin:1px 5px 8px 5px; border:1px solid #777777; background-color:#FFFFFF; border-radius:4px; }
.iCalendar_calSelectDay {	margin:1px;	border-bottom:1px solid #777777; text-align:center; }
.iCalendar_day {	padding:4px 15px; margin-right:5px; opacity:0.4; background-color:#777777!important; color:#FFFFFF; }
.iCalendar_day.iCalSelected { opacity:1; }
.iCalendar_items {	font-size:12px; color:#666666; padding:3px; }
.iCalendar_itemBorder {	border-bottom:1px solid #DDDDDD; }
.
</style>

<div class="eqLogic eqLogic-widget allowResize iCalendar_mobile" data-version="#version#"  style="width:#width#;border:#border#;border-radius:#border-radius#;height:#height#;background-color:#background-color#;color:#color#;#style#" data-eqLogic_id="#id#" data-category="#category#" data-eqLogic_uid="#uid#" >
    <center><span class="iCalendar_title" style="#hideEqLogicName#">#name_display# <span style="font-size:0.85em;">#object_name#</span></span></center>
	<div class='iCalendar_date' style="position:relative;"></div>
	<div class="iCalendar_div">
		<div class='tooltips' style='color:#000000;'>
			<center>... setup ...</center>
		</div>
	</div>
	<script>
		var _iCalendar#id# = #iCalendar-list#;
		var _iCalendar#id#_allowAutoResize = #allowAutoResize#;
		iCal_refreshWidget('#id#',_iCalendar#id#,"#today#");
		iCal_setCSSOption('#id#','#bgColor#','#bgTitleColor#','#bgItemColor#');
	</script>
</div>
